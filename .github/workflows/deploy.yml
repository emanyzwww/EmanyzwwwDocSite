# =========================================================
#  推送到 master 后自动构建并发布到 GitHub Pages
#
#  要点：
#  - 站点域名仍以 .vitepress/data/site.ts 里的 url 为准（用于 sitemap / RSS）
#  - 构建时用 VP_BASE / VP_SITE_URL 覆盖「部署路径」与「绝对地址」，
#    因此项目型站点（https://owner.github.io/repo/）也能正确生成链接
#  - 产物目录是 .vitepress/dist（配置里显式声明，不随命令行 root 变化）
#  - 首次使用需在仓库里设置一次：
#    Settings -> Pages -> Build and deployment -> Source 选「GitHub Actions」
# =========================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # 也可在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务，新推送排队而不是打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 计算本次部署的 base 与站点地址：
      #   仓库名形如 xxx.github.io  -> 用户站点，根路径
      #   其他仓库名                 -> 项目站点，带 /<仓库名>/ 子路径
      # 若在仓库变量里设置了 SITE_URL（例如以后绑定自定义域名），则优先使用它
      - name: Resolve deployment URLs
        id: urls
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          OVERRIDE: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          if [[ "${REPO}" == *.github.io ]]; then
            BASE="/"
            DEFAULT_HOME="https://${OWNER}.github.io/"
          else
            BASE="/${REPO}/"
            DEFAULT_HOME="https://${OWNER}.github.io/${REPO}/"
          fi
          HOME_URL="${OVERRIDE:-$DEFAULT_HOME}"
          # 站点地址不带结尾斜杠，base 必须以斜杠开头和结尾
          HOME_URL="${HOME_URL%/}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "home=${HOME_URL}" >> "$GITHUB_OUTPUT"
          echo "本次部署 base=${BASE}，站点地址=${HOME_URL}"

      - name: Build
        env:
          VP_BASE: ${{ steps.urls.outputs.base }}
          VP_SITE_URL: ${{ steps.urls.outputs.home }}
        run: |
          set -euo pipefail
          pnpm build
          echo "产物文件数：$(find ./.vitepress/dist -type f | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
