# =========================================================
#  推送到 master 后自动构建并发布到 GitHub Pages
#
#  要点：
#  - 站点域名仍以 .vitepress/data/site.ts 里的 url 为准（用于 sitemap / RSS）
#  - 构建时用 VP_BASE / VP_SITE_URL 覆盖「部署路径」与「绝对地址」，
#    因此项目型站点（https://owner.github.io/repo/）也能正确生成链接
#  - 产物目录是 .vitepress/dist（配置里显式声明，不随命令行 root 变化）
#  - 首次使用需在仓库里设置一次：
#    Settings -> Pages -> Build and deployment -> Source 选「GitHub Actions」
#
#  为什么 action 都钉到 40 位 commit SHA 而不是 `@v4`：
#  可变 tag 可以让上游仓库在任何时候把代码指过去。GitHub Actions 的
#  `uses:` 是**以 GITHUB_TOKEN 权限执行上游代码**，一旦某个 action 被入侵
#  或 tag 被移动，攻击者就能在 CI 里篡改即将发布的 dist —— 对静态站来说
#  这就是「干净域名发布恶意 JS」，且没有回滚审计、没有 integrity 校验。
#  钉 SHA 后，升级必须是一次显式提交（Dependabot 会帮你发这种 PR）。
# =========================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # 也可在 Actions 页面手动触发
  workflow_dispatch:

# 最小权限：contents 只读、pages 写、id-token 仅用于 Pages 的 OIDC 部署。
# 这三项是 GitHub Pages 官方部署路径的硬性要求，无法再收紧。
# 刻意**不用** `pull_request_target`：那是 Actions 最经典的提权入口。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务，新推送排队而不是打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 质量门禁：lint / 类型 / 测试 必须在构建前通过。
      #
      # `pnpm audit` 刻意用 `--prod`：生产依赖树是空的（所有依赖都在
      # devDependencies），所以它必然是干净的；而裸 `pnpm audit` 会报
      # vite/esbuild 的 dev-only 漏洞（2 high / 6 moderate），
      # 那些只在 dev server 与构建期生效、不进产物、线上零影响，
      # 却会让 CI 永久红灯 —— 那等于把门禁关掉。
      - name: Quality gate
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm audit --prod

      # 计算本次部署的 base 与站点地址：
      #   仓库名形如 xxx.github.io  -> 用户站点，根路径
      #   其他仓库名                 -> 项目站点，带 /<仓库名>/ 子路径
      # 若在仓库变量里设置了 SITE_URL（例如以后绑定自定义域名），则优先使用它
      - name: Resolve deployment URLs
        id: urls
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          OVERRIDE: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          if [[ "${REPO}" == *.github.io ]]; then
            BASE="/"
            DEFAULT_HOME="https://${OWNER}.github.io/"
          else
            BASE="/${REPO}/"
            DEFAULT_HOME="https://${OWNER}.github.io/${REPO}/"
          fi
          HOME_URL="${OVERRIDE:-$DEFAULT_HOME}"
          # 站点地址不带结尾斜杠，base 必须以斜杠开头和结尾
          HOME_URL="${HOME_URL%/}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "home=${HOME_URL}" >> "$GITHUB_OUTPUT"
          echo "本次部署 base=${BASE}，站点地址=${HOME_URL}"

      - name: Build
        env:
          VP_BASE: ${{ steps.urls.outputs.base }}
          VP_SITE_URL: ${{ steps.urls.outputs.home }}
        run: |
          set -euo pipefail
          pnpm build
          echo "产物文件数：$(find ./.vitepress/dist -type f | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # 部署后冒烟：补上「部署成功了但线上是坏的」这个盲区。
      # 历史上踩过 VP_BASE/VP_SITE_URL 解析错导致全站相对链接断掉的问题，
      # 而那种故障在 Actions 里显示为绿色，只能靠肉眼发现。
      #
      # URL 直接取部署步骤输出的 `page_url`，**不再自己推算**。
      # 曾经在这里按「owner.github.io + /repo/」重算过一次，结果
      # `${HOME}${BASE}` 把仓库路径拼了两遍（HOME 本身已含 repo），
      # 冒烟测的是 .../EmanyzwwwDocSite/EmanyzwwwDocSite/ 这种不存在的地址，
      # 导致部署明明成功、工作流却红叉。
      # 用官方输出还有个额外好处：将来绑自定义域名（vars.SITE_URL）时，
      # 冒烟会自动跟着变，不会和实际部署地址漂移。
      #
      # 页面清单**以 sitemap 为准**，不在 workflow 里硬编码栏目地址：
      # 2026-10 重构（`posts/` → `pages/posts/`）时，这里刚好写死了
      # `zh-cn/posts/`，部署成功却因为冒烟清单过期而红叉——内容结构一变
      # 就得记得改 workflow，这本身就是漏洞。sitemap 是构建产物自己生成的
      # 页面清单，与真实路由同源；逐条请求它，既能自动跟上内容结构，
      # 也能抓到 base / 站点地址拼错导致的整站 404。
      - name: Smoke test
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          # 防御性规整：确保恰好一个结尾斜杠
          ROOT="${SITE%/}/"
          echo "冒烟目标：${ROOT}"

          fail=0

          # ① 稳定入口：站点根、语言首页、栏目首页、sitemap / robots / RSS。
          #    这些地址不随文章增删变化，值得在 sitemap 之外单独断言一次
          #    （sitemap 只覆盖「页面」，不覆盖 robots.txt 与 feed）。
          for path in \
            "" \
            "zh-cn/" \
            "en/" \
            "zh-cn/pages/posts/" \
            "en/pages/posts/" \
            "zh-cn/pages/about/" \
            "en/pages/about/" \
            "zh-cn/pages/tags/" \
            "en/pages/tags/" \
            "sitemap.xml" \
            "robots.txt" \
            "zh-cn/index.xml" \
            "en/index.xml"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 2 "${ROOT}${path}")
            echo "  ${path:-/} -> ${code}"
            if [ "${code}" != "200" ]; then
              echo "::error::冒烟失败：${ROOT}${path} 返回 ${code}"
              fail=1
            fi
          done

          # ② 以 sitemap 为准，把每一个页面都真的请求一遍。
          #    URL 里可能有中文（百分号编码），按空白切分即可，不会有空格。
          locs=$(curl -sS --max-time 20 "${ROOT}sitemap.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's|<loc>||' -e 's|</loc>||' || true)

          if [ -z "${locs}" ]; then
            echo "::error::冒烟失败：sitemap.xml 里没有 <loc>"
            fail=1
          else
            count=0
            for url in ${locs}; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 2 "${url}")
              count=$((count + 1))
              if [ "${code}" != "200" ]; then
                echo "::error::冒烟失败：sitemap 页面 ${url} 返回 ${code}"
                fail=1
              fi
            done
            echo "  sitemap 页面 ${count} 条：全部 200"
          fi

          # ③ 关键内容探针：确认拿到的是真实页面而不是空壳/兜底页
          if ! curl -sS --max-time 20 "${ROOT}hashmap.json" | grep -q 'zh-cn_index'; then
            echo "::error::冒烟失败：hashmap.json 缺 zh-cn_index"
            fail=1
          fi

          if [ "${fail}" -eq 0 ]; then
            echo "✓ 冒烟全部通过"
          fi
          exit "${fail}"
