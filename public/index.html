<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` 必须与 `.vitepress/config.ts` 里覆盖的那一条保持一致：
      缺了它，`env(safe-area-inset-*)` 恒为 0。这个中转页会在 head 里立刻跳走，
      但它自己也可能被短暂渲染，所以同样要给对。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>EmanyzwwwDocSite</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="alternate" hreflang="zh-CN" href="zh-cn/" />
    <link rel="alternate" hreflang="en" href="en/" />
    <link rel="alternate" hreflang="x-default" href="zh-cn/" />
    <style>
      /* 只负责底色，避免暗色模式下闪一下白屏；不渲染任何可见内容 */
      :root {
        color-scheme: light dark;
      }
      html {
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #16171a;
        }
      }
    </style>
    <script>
      /**
       * 根路径只做语言分发，**不显示任何内容**。
       *
       * 规则（按优先级）：
       * 1. 用户上次手动选过语言（localStorage）→ 尊重该选择，不再自动跳；
       * 2. 浏览器语言列表里第一个能匹配上的 → 跳过去；
       * 3. 一个都匹配不上 → 落到默认语言（简体中文）。
       *
       * 为什么脚本放在 `<head>` 里：它在 `<body>` 解析之前执行，
       * 浏览器还没机会绘制任何东西就已经跳走了，因此不会出现
       * 「正在跳转…」这类一闪而过的提示。之前把跳转放在 body 末尾、
       * 还画了一屏文字，结果就是用户会看到一次很突兀的中转页。
       *
       * 链接一律用**相对地址**（`zh-cn/`、`en/`），这样同一个文件在
       * 本地 dev（`/`）、GitHub Pages 项目站点（`/repo/`）、自定义域名（`/`）
       * 三种部署下都指向正确位置，不需要注入 base。
       */
      ;(function () {
        var STORAGE_KEY = 'emanyzwww-locale'
        var DEFAULT_LOCALE = 'zh-cn'
        var SUPPORTED = ['zh-cn', 'en']

        /** 浏览器语言标签 → 本站语言代码；匹配不上返回 null。 */
        function match(tag) {
          var lower = String(tag || '').toLowerCase()
          if (!lower) return null
          // zh、zh-CN、zh-Hans-CN、zh-TW 都归到简体中文站
          if (lower.indexOf('zh') === 0) return 'zh-cn'
          if (lower.indexOf('en') === 0) return 'en'
          return null
        }

        /** 读取上次的手动选择（隐私模式下 localStorage 会抛错，忽略即可）。 */
        function remembered() {
          try {
            var saved = window.localStorage.getItem(STORAGE_KEY)
            return SUPPORTED.indexOf(saved) >= 0 ? saved : null
          } catch (error) {
            return null
          }
        }

        /** 按 navigator.languages 顺序找第一个匹配项。 */
        function detect() {
          var tags =
            navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language]
          for (var i = 0; i < tags.length; i++) {
            var hit = match(tags[i])
            if (hit) return hit
          }
          return null
        }

        /**
         * 目标地址。
         *
         * 用 `new URL(相对路径, 当前地址)` 而不是直接拼字符串：
         * 访问 `/repo`（没有结尾斜杠）时，直接拼 `zh-cn/` 会被浏览器解析成
         * `/zh-cn/`（把 repo 当成文件）；交给 URL 解析则能正确得到 `/repo/zh-cn/`。
         */
        function targetOf(locale) {
          return new URL(locale + '/', window.location.href).href
        }

        var locale = remembered() || detect() || DEFAULT_LOCALE

        // 用 replace 而不是 assign：不往历史记录里塞一条中转页，后退不会弹回来
        window.location.replace(targetOf(locale))
      })()
    </script>
  </head>
  <body>
    <!--
      正常情况下这段永远不会被看到（脚本在 head 里已经跳走）。
      只有禁用 JavaScript 时才会显示，作为兜底入口。
    -->
    <noscript>
      <p><a href="zh-cn/" hreflang="zh-CN" lang="zh-CN">简体中文</a></p>
      <p><a href="en/" hreflang="en" lang="en">English</a></p>
    </noscript>
  </body>
</html>
