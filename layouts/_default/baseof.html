<!doctype html>
<html lang="{{ site.Language.Locale | default site.Language.Lang }}" data-theme="light">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="page page--{{ .Kind }}{{ with .Section }} page--section-{{ . }}{{ end }}">
    <a class="skip-link" href="#main">{{ i18n "skipToContent" }}</a>

    {{ partial "header.html" . }}

    <main id="main" class="container">{{ block "main" . }}{{ end }}</main>

    {{ partial "footer.html" . }} {{ partial "scripts.html" . }}
  </body>
</html>
