{{- $p := . -}}
<nav class="post-nav" aria-label="{{ i18n "postNav" }}">
  {{- with $p.PrevInSection }}
  <a class="post-nav__link" href="{{ .RelPermalink }}">
    <span class="post-nav__label">{{ partial "icons.html" (dict "name" "arrow-left") }} {{ i18n "previousPost" }}</span>
    <span class="post-nav__title">{{ .LinkTitle }}</span>
  </a>
  {{- else }}
  <span></span>
  {{- end }}
  {{- with $p.NextInSection }}
  <a class="post-nav__link post-nav__link--next" href="{{ .RelPermalink }}">
    <span class="post-nav__label">{{ i18n "nextPost" }} {{ partial "icons.html" (dict "name" "arrow-right") }}</span>
    <span class="post-nav__title">{{ .LinkTitle }}</span>
  </a>
  {{- end }}
</nav>
