{{- with site.Taxonomies.tags }} {{- $limit := (hugo.Data.profile.tagsLimit | default 20) }}
<section class="card">
  <p class="card__title">{{ i18n "tags" }}</p>
  <ul class="tag-list">
    {{- range first $limit .ByCount }}
    <li>
      <a class="tag" href="{{ .Page.RelPermalink }}"
        >{{ .Page.LinkTitle }} <span class="tag__count">{{ .Count }}</span></a
      >
    </li>
    {{- end }}
  </ul>
</section>
{{- end }}
