{{- $links := hugo.Data.profile.links -}}
{{- with $links }}
<section class="card">
  <p class="card__title">{{ i18n "links" }}</p>
  <div class="widget__body">
    <ul>
      {{- range . }}
      <li>
        <a href="{{ .url }}"{{ if hasPrefix .url "http" }} target="_blank" rel="noopener noreferrer"{{ end }}>
          {{ .label }}
        </a>
      </li>
      {{- end }}
    </ul>
  </div>
</section>
{{- end }}
