# =========================================================
#  站点配置
#  平时写文章不用动这个文件；只有改站点名、语言、导航时才看
# =========================================================

baseURL = 'https://emanyzoo.cn/'
title = 'EmanyzwwwDocSite'
enableRobotsTXT = true
enableEmoji = true

# --- 语言 ---
defaultContentLanguage = 'zh-cn'
defaultContentLanguageInSubdir = false

# --- 分页 ---
[pagination]
pagerSize = 10

# --- Markdown ---
[markup]
[markup.goldmark.renderer]
# 允许在 Markdown 里直接写 HTML（做自定义组件时要用到）
unsafe = true
[markup.highlight]
noClasses = true
style = 'github-dark'
lineNos = false
tabWidth = 2
[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

# --- 主题参数 ---
[params]
author = 'Emanyzwww'
description = '一个用 Hugo 搭建的静态站点。'
# 头部品牌名：显示在导航栏左侧，默认用站点标题
brandName = 'Emanyzwww'
# 头部品牌 logo（可选）：指向 static 下的图片，留空则只显示文字
brandLogo = ''
# 头像与个人资料都在 data/profile.yaml 里改
# 首页侧栏组件：按顺序渲染 layouts/partials/widgets/<名字>.html
widgets = ['profile', 'tags', 'links', 'custom']
toc = true # 文章默认生成目录（较短的文章会自动隐藏）
showReadingTime = true
footerText = '' # 页脚附加文字，留空则不显示（旧字段，建议改用下面的 footer 配置）
since = 2026 # 页脚版权起始年份

# --- 页脚自定义 ---
[params.footer]
# 完整版权文本（可选）：填写后覆盖默认的「© 年份 站名」
copyright = ''
# 附加说明文字，支持 Markdown
text = ''
# 链接列表（可选）：每项 { name, url }
[[params.footer.links]]
name = 'GitHub'
url = 'https://github.com/emanyzwww'

[[params.footer.links]]
name = 'Hugo'
url = 'https://gohugo.io/'

# --- 导航（每种语言各自一份） ---
[[languages.zh-cn.menus.main]]
name = '首页'
pageRef = '/'
weight = 10

[[languages.zh-cn.menus.main]]
name = '文章'
pageRef = '/posts'
weight = 20

[[languages.zh-cn.menus.main]]
name = '标签'
pageRef = '/tags'
weight = 30

[[languages.zh-cn.menus.main]]
name = '关于'
pageRef = '/about'
weight = 40

# --- 语言定义 ---
[languages]
[languages.zh-cn]
label = '简体中文'
locale = 'zh-CN'
direction = 'ltr'
weight = 1
title = 'Emanyzwww'
[languages.zh-cn.params]
description = '一个用 Hugo 搭建的静态站点。'

[languages.en]
label = 'English'
locale = 'en'
direction = 'ltr'
weight = 2
title = 'Emanyzwww'
[languages.en.params]
description = 'A static site built with Hugo.'

[[languages.en.menus.main]]
name = 'Home'
pageRef = '/'
weight = 10

[[languages.en.menus.main]]
name = 'Posts'
pageRef = '/posts'
weight = 20

[[languages.en.menus.main]]
name = 'Tags'
pageRef = '/tags'
weight = 30

[[languages.en.menus.main]]
name = 'About'
pageRef = '/about'
weight = 40
